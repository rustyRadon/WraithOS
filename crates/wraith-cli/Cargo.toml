[package]
name = "wraith-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# The CLI engine
clap = { version = "4.0", features = ["derive"] }
# The Crypto & Identity
bip39 = { version = "2.0", features = ["rand"] }
confy = "0.6"
serde = { version = "1.0", features = ["derive"] }
# Our internal crates
sentinel-crypto = { path = "../sentinel-core/crates/sentinel-crypto" }
sentinel-core = { path = "../sentinel-core" }
hex.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
anyhow = "1.0"
wraith-fs = { path = "../wraith-fs" }
tokio = { version = "1.0", features = ["full"] } # "full" fixes the async main error
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
rustls = { workspace = true, features = ["ring"] }
async-trait = "0.1"
